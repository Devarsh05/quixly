# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "8ad730c2c915afc9e7dcae3ee071f7e0"
name = "quixly"
application_url = "https://p01--quixly-app--5x5p4hmrvgxk.code.run"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/update"
  topics = [ "products/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  # Shopify's three MANDATORY compliance webhooks (privacy law). Required for App Store
  # submission: the automated review sends test payloads — including one with a deliberately
  # invalid HMAC, which must be answered 401 — and rejects the app if any endpoint misbehaves.
  #
  # `compliance_topics`, not `topics`: these are declared separately from ordinary subscriptions.
  # (The older `[webhooks.privacy_compliance]` block with `customer_data_request_url` /
  # `customer_deletion_url` / `shop_deletion_url` is the superseded CLI schema.)
  #
  # Relative `uri`s, like the three subscriptions above: the CLI resolves them against
  # `application_url`, so the submitted config points at the deployed shell with no hardcoded
  # host, and a future URL cutover moves all six at once. This block declares webhook URLs only —
  # it touches no scope, so it triggers NO merchant re-consent.

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# The settled scope set for the taxonomy write path (Phase 3, step 2c spike + step 4).
#   write_products    — the taxonomy attribute / description / category writes themselves.
#                       Implies read_products, which is why it is not listed separately.
#   read_metaobjects  — toward resolving a taxonomy value to its per-shop metaobject-entry GID.
#                       A category-attribute metafield is list.metaobject_reference and REJECTS
#                       the canonical TaxonomyValue GID (spike L1).
#                       NOT SUFFICIENT ON ITS OWN — proven 2026-07-27 (L6): with this granted,
#                       the standard-taxonomy metaobject surface is STILL silently empty.
#                       metaobjectDefinitions needs `read_metaobject_definitions`, a distinct
#                       scope (schema-level vs this instance-level one). Adding it is a SECOND
#                       merchant re-consent — a pending decision, not an oversight.
#   read_publications — confirm the Shopify Catalog / Agentic channel exists on the store and
#                       whether a product is published to it (spike L4 was ACCESS_DENIED).
# Scopes are owned by Shopify managed installation (use_legacy_install_flow is unset), so this
# is the single source of truth: shopify.server.ts deliberately leaves `scopes` undefined.
# Changing this line triggers a merchant re-consent on next app load.
scopes = "write_products,read_metaobjects,read_publications"

[auth]
redirect_urls = [ "https://p01--quixly-app--5x5p4hmrvgxk.code.run/auth/callback" ]
